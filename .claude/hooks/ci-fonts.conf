<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  CI's fonts for the browser tests of a Claude Code cloud session (human
  decision, 2026-10-16). CI's Ubuntu runner draws sans-serif text in DejaVu
  Sans; the cloud image prefers Inter, whose other widths made layout tests
  pass here and fail in CI. .claude/hooks/session-start.sh installs this file
  in the user's fontconfig directory, so every browser of the session falls
  back to DejaVu Sans as CI's does. `fc-match sans-serif` then says DejaVu Sans.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/Inter*</glob>
      <pattern><patelt name="family"><string>Inter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Inter Display</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
