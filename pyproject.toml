[project]
name = "nock"
version = "0.1.0"
description = "Nock: an online collaborative arrowword (mots fléchés) game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# --- black: the only formatter ------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py313", "py314"]

# --- ruff: linter only (formatting is black's job) ----------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (PEP 8)
    "W",    # pycodestyle warnings (PEP 8)
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # PEP 8 naming
    "D",    # docstrings
    "ANN",  # every function is annotated
    "UP",   # modern syntax for the target Python
    "B",    # likely bugs
    "SIM",  # simplifications
    "C4",   # comprehensions
    "PT",   # pytest style
    "RUF",  # ruff-specific checks
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["nock"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Test names carry the meaning (test_ac1_...), so docstrings are optional there.
"tests/**" = ["D"]

# --- pyrefly: type checker ----------------------------------------------------
[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
python-version = "3.13"

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
