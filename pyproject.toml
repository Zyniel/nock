[project]
name = "nock"
version = "0.1.0"
description = "Nock: an online collaborative arrowword (mots fléchés) game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx2>=2.13.1",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.0",
]

# --- black: the only formatter ------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py313", "py314"]

# --- ruff: linter only (formatting is black's job) ----------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (PEP 8)
    "W",    # pycodestyle warnings (PEP 8)
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # PEP 8 naming
    "D",    # docstrings
    "ANN",  # every function is annotated
    "UP",   # modern syntax for the target Python
    "B",    # likely bugs
    "SIM",  # simplifications
    "C4",   # comprehensions
    "PT",   # pytest style
    "RUF",  # ruff-specific checks
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["nock"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Test names carry the meaning (test_ac1_...), so docstrings are optional there.
"tests/**" = ["D"]

# --- pyrefly: type checker ----------------------------------------------------
[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
# tests/ on the import path, so split test files can import their spec's
# shared harness module, e.g. `from spec035_harness import ...` (2026-10-14).
search-path = ["src", "tests"]
python-version = "3.13"

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Browser tests run in Chromium and WebKit here; CI adds Firefox through
    # PYTEST_ADDOPTS (human decision, 2026-10-10: all three engines). Firefox is
    # left out locally because Windows blocks its executable on this machine.
    "--browser",
    "chromium",
    "--browser",
    "webkit",
]
