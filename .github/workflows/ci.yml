name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request changes anything a browser test can see. One that
  # changes only files under specs/ or docs/ skips the browser jobs: no test
  # reads those folders, and the static job still checks the specs against
  # their tests (spec traceability). A push to main runs every job (human
  # decision, 2026-10-21).
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.files.outputs.browsers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List the changed files
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          browsers=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
            echo "$changed_files"
            other_files=$(echo "$changed_files" | grep -vE '^(specs|docs)/' || true)
            if [ -n "$changed_files" ] && [ -z "$other_files" ]; then
              browsers=false
            fi
          fi
          echo "Browser jobs run: $browsers"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"

  # The static checks and the tests without a browser, on the oldest Python.
  # They run for every pull request.
  static:
    name: Quality gate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - label: static and non-browser tests, ubuntu-latest, Python 3.13
            os: ubuntu-latest
            python-version: "3.13"
            gate-options: --tests other
            engine: ""
    steps: &gate-steps
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web client
        run: npm --prefix web ci

      - name: Install the browser for browser tests
        if: matrix.engine != ''
        run: uv run playwright install --with-deps ${{ matrix.engine }}

      # Each test runs its own local server and opens new connections to it, and
      # a closed connection keeps its port for minutes (TIME_WAIT). With four
      # workers, Windows' default 16,384 ephemeral ports ran out once
      # (net::ERR_NO_BUFFER_SPACE, 2026-10-15); this gives it 49,152. The range
      # starts above 10080, the highest port browsers refuse to load
      # (net::ERR_UNSAFE_PORT, 2026-10-16).
      - name: Widen the range of ephemeral ports
        if: runner.os == 'Windows'
        run: |
          netsh int ipv4 set dynamicport tcp start=16384 num=49152
          "Logical processors: $env:NUMBER_OF_PROCESSORS"

      # The same command you run locally and that the Claude Code hooks run.
      - name: Run the quality gate
        run: uv run python scripts/gate.py ${{ matrix.gate-options }}

      - name: Show the connections waiting out TIME_WAIT
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 show dynamicport tcp
          "TIME_WAIT connections: $((Get-NetTCPConnection -State TimeWait -ErrorAction SilentlyContinue).Count)"

  browsers:
    name: Quality gate (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One job per browser engine on Ubuntu, Chromium and WebKit on Windows
      # (human decisions, 2026-10-15 and 2026-10-17). The Chromium jobs also
      # run the tests without a browser, so those run on both systems and both
      # Pythons. Firefox has no Windows job: it was the slowest job, and it
      # failed in 5 of 10 runs, each time a timeout that passed on re-run
      # (2026-10-17). The Windows jobs run 3 workers, one less than the
      # runner's 4 CPUs: with 4, each driving a browser and a local server, the
      # runner once stalled for over 5 s and two tests timed out together
      # (2026-10-16).
      matrix:
        include:
          - label: chromium, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --browsers chromium
            engine: chromium
          - label: firefox, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers firefox
            engine: firefox
          - label: webkit, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers webkit
            engine: webkit
          - label: chromium, windows-latest, Python 3.14
            os: windows-latest
            python-version: "3.14"
            gate-options: --skip-static --browsers chromium --workers 3
            engine: chromium
          - label: webkit, windows-latest, Python 3.14
            os: windows-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers webkit --workers 3
            engine: webkit
    steps: *gate-steps

  # One check that passes only when every gate job passed, so the branch rule
  # of main needs to require this name only, whatever the matrix holds. The
  # browser jobs may be skipped only when the changed files allow it.
  all-gates:
    name: Quality gate
    if: always()
    needs: [changes, static, browsers]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every gate job passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
          BROWSERS_RUN: ${{ needs.changes.outputs.browsers }}
        run: |
          echo "changes: $CHANGES_RESULT, static: $STATIC_RESULT, browsers: $BROWSERS_RESULT (run: $BROWSERS_RUN)"
          test "$CHANGES_RESULT" = "success"
          test "$STATIC_RESULT" = "success"
          if [ "$BROWSERS_RUN" = "false" ]; then
            test "$BROWSERS_RESULT" = "skipped"
          else
            test "$BROWSERS_RESULT" = "success"
          fi
