name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One job per browser engine and system, plus one job for the static
      # checks and the tests without a browser on the oldest Python (human
      # decision, 2026-10-15). The Chromium jobs also run the tests without a
      # browser, so those run on both systems and both Pythons.
      matrix:
        include:
          - label: static and non-browser tests, ubuntu-latest, Python 3.13
            os: ubuntu-latest
            python-version: "3.13"
            gate-options: --tests other
            engine: ""
          - label: chromium, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --browsers chromium
            engine: chromium
          - label: firefox, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers firefox
            engine: firefox
          - label: webkit, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers webkit
            engine: webkit
          - label: chromium, windows-latest, Python 3.14
            os: windows-latest
            python-version: "3.14"
            gate-options: --skip-static --browsers chromium
            engine: chromium
          - label: firefox, windows-latest, Python 3.14
            os: windows-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers firefox
            engine: firefox
          - label: webkit, windows-latest, Python 3.14
            os: windows-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers webkit
            engine: webkit
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web client
        run: npm --prefix web ci

      - name: Install the browser for browser tests
        if: matrix.engine != ''
        run: uv run playwright install --with-deps ${{ matrix.engine }}

      # The same command you run locally and that the Claude Code hooks run.
      - name: Run the quality gate
        run: uv run python scripts/gate.py ${{ matrix.gate-options }}

  # One check that passes only when every gate job passed, so the branch rule
  # of main needs to require this name only, whatever the matrix holds.
  all-gates:
    name: Quality gate
    if: always()
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check that every gate job passed
        run: test "${{ needs.gate.result }}" = "success"
