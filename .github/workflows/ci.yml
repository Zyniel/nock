name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every engine on demand, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which gate jobs a pull request needs, from the files it changes. A file
  # that no check and no test reads needs none: backlog/, CLAUDE.md,
  # claude_docs/, .claude/ (agents, skills, session settings and hooks),
  # docs/ outside docs/design/, and the container files. A file that only the
  # static job reads skips the browser jobs: specs/ (spec traceability),
  # docs/design/ (the screens sheet), grids/ (the grids the repository ships)
  # and README.md (its font credits, a test without a browser). Any other
  # file, and a Python file anywhere (ruff and black read the whole
  # repository), runs every job. A push to main runs every job (human
  # decision, 2026-10-21).
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      static: ${{ steps.files.outputs.static }}
      browsers: ${{ steps.files.outputs.browsers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List the changed files
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          static=true
          browsers=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Paths as written: a quoted one ("backlog/drafts/... \302\253 ...")
            # would match no pattern below and run every job.
            changed_files=$(git -c core.quotePath=false diff --name-only \
              --no-renames "$BASE_SHA...$HEAD_SHA")
            echo "$changed_files"
            if [ -n "$changed_files" ]; then
              static=false
              browsers=false
              while IFS= read -r file; do
                case "$file" in
                  specs/* | docs/design/* | grids/* | README.md)
                    static=true
                    ;;
                  *.py)
                    static=true
                    browsers=true
                    ;;
                  backlog/* | CLAUDE.md | claude_docs/* | .claude/* | docs/* | \
                  Dockerfile | .dockerignore | compose.yaml | compose.*.yaml | \
                  Caddyfile | .env.*.example)
                    ;;
                  *)
                    static=true
                    browsers=true
                    ;;
                esac
              done <<< "$changed_files"
            fi
          fi
          echo "Static job runs: $static"
          echo "Browser jobs run: $browsers"
          echo "static=$static" >> "$GITHUB_OUTPUT"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"

  # The static checks and the tests without a browser, on the oldest Python.
  # They run for every pull request that changes a file a check reads.
  static:
    name: Quality gate (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.static == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - label: static and non-browser tests, ubuntu-latest, Python 3.13
            os: ubuntu-latest
            python-version: "3.13"
            gate-options: --tests other
            engine: ""
    steps: &gate-steps
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web client
        run: npm --prefix web ci

      - name: Install the browser for browser tests
        if: matrix.engine != ''
        run: uv run playwright install --with-deps ${{ matrix.engine }}

      # The same command you run locally and that the Claude Code hooks run.
      - name: Run the quality gate
        run: uv run python scripts/gate.py ${{ matrix.gate-options }}

  # The browser tests of a pull request: Chromium on Ubuntu, which also runs
  # the tests without a browser on the newer Python (human decision,
  # 2026-10-21: while the design is still moving, pull requests run one engine
  # and no Windows job; the Windows jobs were the slowest and the WebKit ones
  # failed most often on a tap timeout that passed on re-run). Windows is
  # covered by the local gate, which every agent runs there before it stops.
  browsers:
    name: Quality gate (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - label: chromium, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --browsers chromium
            engine: chromium
    steps: *gate-steps

  # Firefox and WebKit, on Ubuntu, after a merge into main and on demand
  # (workflow_dispatch), never on a pull request (human decision, 2026-10-21).
  # A failure here is fixed in the next pull request.
  other-engines:
    name: Quality gate (${{ matrix.label }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: firefox, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers firefox
            engine: firefox
          - label: webkit, ubuntu-latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
            gate-options: --skip-static --tests browser --browsers webkit
            engine: webkit
    steps: *gate-steps

  # One check that passes only when every gate job passed, so the branch rule
  # of main needs to require this name only, whatever the matrix holds. The
  # static and browser jobs may be skipped only when the changed files allow
  # it, and the other engines only on a pull request.
  all-gates:
    name: Quality gate
    if: always()
    needs: [changes, static, browsers, other-engines]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every gate job passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          STATIC_RUN: ${{ needs.changes.outputs.static }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
          BROWSERS_RUN: ${{ needs.changes.outputs.browsers }}
          OTHER_ENGINES_RESULT: ${{ needs.other-engines.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "changes: $CHANGES_RESULT, static: $STATIC_RESULT (run: $STATIC_RUN), browsers: $BROWSERS_RESULT (run: $BROWSERS_RUN), other engines: $OTHER_ENGINES_RESULT"
          test "$CHANGES_RESULT" = "success"
          if [ "$STATIC_RUN" = "false" ]; then
            test "$STATIC_RESULT" = "skipped"
          else
            test "$STATIC_RESULT" = "success"
          fi
          if [ "$BROWSERS_RUN" = "false" ]; then
            test "$BROWSERS_RESULT" = "skipped"
          else
            test "$BROWSERS_RESULT" = "success"
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$OTHER_ENGINES_RESULT" = "skipped"
          else
            test "$OTHER_ENGINES_RESULT" = "success"
          fi
