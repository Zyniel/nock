name: Deploy

# Optional trigger for a deployment (docs/hosting.md section 10,
# docs/oracle-setup.md). The same deployment can be started from your own
# computer with one SSH command, at no Actions cost.
#
# It runs no tests and builds nothing, to spend few Actions minutes: it checks
# that CI already passed on the tagged commit, then asks the server to run
# deploy.sh, which fetches, builds and starts the version on the server. It
# lasts as long as the server's build (a few minutes).
#
# Needs, in Settings > Environments > production > Environment secrets:
#   DEPLOY_HOST         the server's public IP address
#   DEPLOY_USER         the SSH user (ubuntu)
#   DEPLOY_SSH_KEY      the private key of the deploy key pair
#   DEPLOY_KNOWN_HOSTS  the server's host key line (ssh-keyscan output)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to deploy, for example v1.0.0"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  deploy:
    name: Deploy to the server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Not a version tag: $TAG" >&2
            exit 1
          fi

      - name: Check that CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
          passed="$(gh run list --repo "$REPO" --workflow ci.yml --commit "$sha" \
            --status success --json databaseId --jq length)"
          if [ "$passed" = "0" ]; then
            echo "CI has not passed on $sha ($TAG). Tag a commit whose CI is green." >&2
            exit 1
          fi
          echo "CI passed on $sha"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$TARGET" "/srv/nock/deploy/deploy.sh '$TAG'"
