services:
  nock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nock-dev
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      NOCK_HOST: ${NOCK_HOST}
      NOCK_PORT: ${NOCK_PORT}
      NOCK_DATABASE: ${NOCK_DATABASE}
      NOCK_PUBLIC_URL: ${NOCK_PUBLIC_URL}
      NOCK_OPERATOR_TOKEN: ${NOCK_OPERATOR_TOKEN}
      NOCK_SMTP_HOST: mailpit
      NOCK_SMTP_PORT: "1025"
      NOCK_SMTP_SECURITY: none
      NOCK_SMTP_FROM: nock@localhost
    volumes:
      - nock_data:/data
      - ./grids:/app/grids:ro
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: nock-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  nock_data: